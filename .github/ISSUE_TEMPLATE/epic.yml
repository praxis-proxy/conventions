# Epics organize implementation work for an accepted proposal.
# See docs/proposals.md for the full lifecycle.
name: Epic
description: Track a large body of related work
labels: ["epic", "triage/needs-triage"]
body:
  - type: input
    id: discussion
    attributes:
      label: Originating Discussion
      description: Link to the approved discussion (see docs/proposals.md)
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What does this epic accomplish?
    validations:
      required: true
  - type: textarea
    id: success-criteria
    attributes:
      label: Success Criteria
      description: How do we know this is done?
    validations:
      required: true
  - type: textarea
    id: sub-tasks
    attributes:
      label: Sub-Tasks
      description: Known work items (will become sub-issues)
      placeholder: |
        - [ ] Task 1
        - [ ] Task 2
