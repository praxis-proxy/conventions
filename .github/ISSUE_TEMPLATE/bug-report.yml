# Customize labels and add a project-specific Area dropdown when scaffolding.
name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "triage/needs-triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to trigger the bug
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "v0.1.0"
