name: GHCR Publish
description: Log in to GHCR, extract metadata, and build/push a container image

inputs:
  image-name:
    description: "Full image name (e.g. ghcr.io/org/repo)"
    required: true
  metadata-context:
    description: 'Metadata source: "workflow" (run context) or "git" (checked-out commit context)'
    required: false
    default: "workflow"
  containerfile:
    description: "Path to the Containerfile/Dockerfile"
    required: false
    default: "Containerfile"
  push:
    description: "Push the built image to the registry"
    required: false
    default: "true"
  registry:
    description: "Container registry URL"
    required: false
    default: "ghcr.io"

runs:
  using: composite
  steps:
    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ inputs.registry }}/${{ inputs.image-name }}
        context: ${{ inputs.metadata-context }}
        tags: |
          type=sha
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Build and push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ${{ inputs.containerfile }}
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
