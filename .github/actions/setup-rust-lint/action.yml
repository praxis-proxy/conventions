name: Setup Rust (Lint)
description: Install nightly Rust (for rustfmt) and stable Rust (with clippy), then cache Cargo artifacts

inputs:
  rust-version:
    description: "Stable Rust version to install"
    required: false
    default: "1.96.0"
  nightly-toolchain:
    description: "SHA for dtolnay/rust-toolchain nightly pin"
    required: false
    default: "5b842231ba77f5c045dba54ac5560fed2db780e2" # nightly-2026-03-28
  cache-suffix:
    description: "Suffix for cache key uniqueness"
    required: false
    default: "cargo"

runs:
  using: composite
  steps:
    - name: Install nightly Rust (for rustfmt)
      uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly-2026-03-28
      with:
        components: rustfmt

    - name: Register nightly under date-pinned name
      run: |
        rustup toolchain install nightly-2026-03-28 --profile minimal --component rustfmt
      shell: bash

    - name: Install stable Rust
      uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
      with:
        toolchain: ${{ inputs.rust-version }}
        components: clippy

    - name: Cache Cargo registry and build artifacts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: ${{ runner.os }}-rust-${{ inputs.rust-version }}-${{ inputs.cache-suffix }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-rust-${{ inputs.rust-version }}-${{ inputs.cache-suffix }}-
        save-always: true
