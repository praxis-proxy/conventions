name: Coverage Check
description: Install cargo-llvm-cov and run a coverage make target

inputs:
  rust-version:
    description: "Stable Rust version to install"
    required: false
    default: "1.96.0"

runs:
  using: composite
  steps:
    - name: Install stable Rust
      uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
      with:
        toolchain: ${{ inputs.rust-version }}
        components: llvm-tools-preview

    - name: Cache cargo-llvm-cov binary
      id: cache-llvm-cov
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/bin/cargo-llvm-cov
        key: cargo-llvm-cov-${{ runner.os }}

    - name: Install cargo-llvm-cov
      if: steps.cache-llvm-cov.outputs.cache-hit != 'true'
      run: cargo install cargo-llvm-cov --locked
      shell: bash

    - name: Cache Cargo registry and build artifacts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target/llvm-cov-target
        key: ${{ runner.os }}-rust-${{ inputs.rust-version }}-coverage-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-rust-${{ inputs.rust-version }}-coverage-
        save-always: true

    - name: Run coverage check
      run: make coverage-check
      shell: bash
