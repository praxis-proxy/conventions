name: Supply Chain Audit
description: Run cargo audit and optionally cargo deny for supply chain safety

inputs:
  rust-version:
    description: "Stable Rust version to install"
    required: false
    default: "1.96.0"
  run-deny:
    description: "Run cargo deny check after audit"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install stable Rust
      uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
      with:
        toolchain: ${{ inputs.rust-version }}

    - name: Install cargo-audit
      uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
      with:
        tool: cargo-audit

    - name: Install cargo-deny
      if: inputs.run-deny == 'true'
      uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
      with:
        tool: cargo-deny

    - name: Run cargo audit
      run: cargo audit
      shell: bash

    - name: Run cargo deny
      if: inputs.run-deny == 'true'
      run: cargo deny check
      shell: bash
