# Keeps cargo dependencies and SHA-pinned GitHub Actions current.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Builder image tracks the MSRV, not Dependabot; allow Alpine patch bumps.
      - dependency-name: "rust"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
