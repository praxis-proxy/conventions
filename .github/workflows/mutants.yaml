name: Mutation Testing

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------
#
# Coverage proves code executed; mutation testing proves the assertions
# would notice if the code were wrong. Weekly because it rebuilds the
# workspace once per mutant.
#
# Other repositories run this same file through workflow_call. The caller job
# must grant at least the permissions the jobs below ask for. Actions are
# pinned by SHA rather than referenced by local path, because a called
# workflow resolves local paths against the caller's checkout.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-mutants
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ----------------------------------------------------------------------------
  # Mutants
  # ----------------------------------------------------------------------------

  mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect workspace members
        id: ws
        run: |
          if grep -qE '^members = \[\]$' Cargo.toml; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Rust
        if: steps.ws.outputs.empty == 'false'
        uses: praxis-proxy/conventions/.github/actions/setup-rust@747ec184a0e565c1948bb77ea58487839b78db55 # v0.2.0-9-g747ec18
        with:
          cache-suffix: mutants

      - name: Cache cargo-mutants
        if: steps.ws.outputs.empty == 'false'
        id: cache-mutants
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-mutants
          key: cargo-mutants-${{ runner.os }}

      - name: Install cargo-mutants
        if: steps.ws.outputs.empty == 'false' && steps.cache-mutants.outputs.cache-hit != 'true'
        # The shared rust-cache also restores ~/.cargo/bin, so the binary may
        # already be present even when this step's own cache key misses. Install
        # only when it is absent; otherwise cargo install aborts "binary exists".
        run: command -v cargo-mutants > /dev/null || cargo install cargo-mutants --locked

      - name: Run mutation testing
        if: steps.ws.outputs.empty == 'false'
        run: make mutants
