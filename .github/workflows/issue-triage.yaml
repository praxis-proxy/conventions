name: Issue Triage

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------
#
# Keeps the triage labels up to date and keeps assignees off issues that
# haven't been triaged. An issue counts as triaged once it has a milestone AND
# is on at least one project board.
#
# A new issue is labeled `triage/needs-triage`, unless it already has a
# milestone or `triage/accepted`. When an issue gets a milestone, that label is
# swapped for `triage/accepted`, which sticks even if the milestone is removed
# later. Both labels must already exist in the repository, since
# `gh issue edit` fails on a label it can't find.
#
# When someone is assigned to an issue that isn't triaged, everyone assigned to
# it is unassigned and mentioned in a comment linking the policy doc. If the
# issue or its boards can't be read, the assignees are left alone.
#
# Everything runs through the GitHub API only; no code is checked out.
#
# Other repositories run this same file through workflow_call, from a caller
# triggered by `issues: [opened, assigned, milestoned]`. The caller job needs
# no permissions of its own, but must pass the praxis-bot secrets. When this
# runs here on issues the inputs context is empty, so each input's default
# is repeated where the input is read.
#
# The praxis-bot GitHub App token needs these permissions for this to work:
#   - Repository "Issues": read & write   (label, unassign, comment)
#   - Organization "Projects": read       (board membership)

on:
  issues:
    types: [opened, assigned, milestoned]
  workflow_call:
    inputs:
      policy-doc:
        description: >-
          Repository path (and anchor) of the triage policy the unassignment
          comment links to. A full URL also works.
        type: string
        default: docs/development.md#picking-up-work
    secrets:
      PRAXIS_BOT_APP_ID:
        description: praxis-bot app ID
        required: true
      PRAXIS_BOT_APP_PRIVATE_KEY:
        description: praxis-bot app private key
        required: true

concurrency:
  # The suffix keeps this group distinct from a caller's own
  # `${{ github.workflow }}-<number>` group, which would otherwise deadlock.
  # Only one run can wait per group, and a newer pending run replaces an older
  # one. Opened and milestoned runs share a label group so they can't race on
  # the labels, and assigned runs get their own group so a label run never
  # replaces a pending assigned run.
  group: ${{ github.workflow }}-issue-triage-${{ github.event.action == 'assigned' && 'assign' || 'label' }}-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  # ----------------------------------------------------------------------------
  # Triage
  # ----------------------------------------------------------------------------

  triage:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.PRAXIS_BOT_APP_ID }}
          private-key: ${{ secrets.PRAXIS_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Flag new issues for triage
        if: >-
          github.event.action == 'opened' && !github.event.issue.milestone
          && !contains(github.event.issue.labels.*.name, 'triage/accepted')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE" --repo "$GH_REPO" \
            --add-label "triage/needs-triage"

      - name: Accept milestoned issues
        if: github.event.action == 'milestoned'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE" --repo "$GH_REPO" \
            --remove-label "triage/needs-triage" \
            --add-label "triage/accepted"

      - name: Unassign un-triaged issues
        if: github.event.action == 'assigned'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          POLICY_DOC: ${{ inputs.policy-doc || 'docs/development.md#picking-up-work' }}
        run: |
          set -euo pipefail

          # Prints "triaged", "unassigned" (nobody is assigned any more), or
          # "untriaged" followed by the current assignees. Prints nothing when
          # the issue or its boards can't be read, so an API error never costs
          # anyone an assignment.
          triage_state() {
            local json
            # $owner/$repo/$num are GraphQL variables bound by the -F flags, so
            # the query stays single-quoted (SC2016 misfires on gh's -f).
            # shellcheck disable=SC2016
            json="$(gh api graphql \
              -f query='query($owner:String!,$repo:String!,$num:Int!){repository(owner:$owner,name:$repo){issue(number:$num){milestone{number} projectItems(first:1){totalCount} assignees(first:100){nodes{login}}}}}' \
              -F owner="${GH_REPO%%/*}" -F repo="${GH_REPO#*/}" -F num="$ISSUE" \
              2>/dev/null)" || return 0
            jq -r '
              .data.repository.issue
              | if (.projectItems.totalCount | type) != "number" then empty
                elif .milestone != null and .projectItems.totalCount > 0 then "triaged"
                elif (.assignees.nodes | length) == 0 then "unassigned"
                else "untriaged " + ([.assignees.nodes[].login] | join(" ")) end' \
              <<< "$json" 2>/dev/null || true
          }

          read -r state logins <<< "$(triage_state)"

          # Triage done by hand can take a minute or so, with the assignee,
          # milestone, and board landing in any order, so give it a few
          # minutes before undoing anything. Everyone still assigned after
          # that goes, so the last run standing cleans up even if GitHub
          # dropped a pending run in between.
          for _ in $(seq 9); do
            [ "$state" = "untriaged" ] || break
            sleep 20
            read -r state logins <<< "$(triage_state)"
          done

          case "$state" in
            untriaged) ;;
            triaged)
              echo "::notice::#${ISSUE} is triaged; keeping its assignees"
              exit 0 ;;
            unassigned)
              echo "::notice::nobody is assigned to #${ISSUE} any more"
              exit 0 ;;
            *)
              echo "::warning::could not read #${ISSUE}; leaving it alone"
              exit 0 ;;
          esac

          echo "::warning::#${ISSUE} has not been triaged; unassigning ${logins}"
          gh issue edit "$ISSUE" --repo "$GH_REPO" --remove-assignee "${logins// /,}"

          case "$POLICY_DOC" in
            http://* | https://*) policy_url="$POLICY_DOC" ;;
            *) policy_url="${GITHUB_SERVER_URL}/${GH_REPO}/blob/HEAD/${POLICY_DOC#/}" ;;
          esac

          gh issue comment "$ISSUE" --repo "$GH_REPO" \
            --body "Hi @${logins// / @}, this issue hasn't been triaged yet, so I've unassigned you for now. It can be assigned once it has a milestone and is on a project board. See the [triage policy](${policy_url}) for details."
