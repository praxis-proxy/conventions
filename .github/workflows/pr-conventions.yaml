name: PR Conventions

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------
#
# Enforces the reviewability rules documented in docs/conventions.md. All
# checks operate through
# the GitHub API only — PR code is never checked out, so pull_request_target
# is safe here.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # ----------------------------------------------------------------------------
  # PR Size Check
  # ----------------------------------------------------------------------------

  pr-size-check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Check PR size
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MAX_ADDITIONS: "750"
        run: |
          labels=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels -q '.labels[].name')
          if echo "$labels" | grep -q '^skip/pr-conventions$'; then
            echo "skip/pr-conventions label present — skipping size check"
            exit 0
          fi

          added=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --paginate \
            --jq '[.[] | select(.filename | test("Cargo\\.(lock|toml)$|^(examples/|tests/|benchmarks/|docs/)") | not) | select(.filename | test("\\.md$") | not) | .additions] | add // 0')

          if [ "$added" -gt "$MAX_ADDITIONS" ]; then
            marker="<!-- conventions:pr-size-check -->"
            already=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --jq "[.[] | select(.body | contains(\"${marker}\"))] | length")
            if [ "$already" -eq 0 ]; then
              gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
                --body "${marker}
          **PR too large**: ${added} lines added (limit: ${MAX_ADDITIONS}, excludes Cargo files, tests, docs, examples, and benchmarks). Please split into smaller PRs. Add \`skip/pr-conventions\` label to override."
            fi
            echo "::error::PR has ${added} lines added (limit: ${MAX_ADDITIONS})"
            exit 1
          fi

  # ----------------------------------------------------------------------------
  # PR Description Check
  # ----------------------------------------------------------------------------

  pr-description-check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Check for description
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          labels=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels -q '.labels[].name')
          if echo "$labels" | grep -q '^skip/pr-conventions$'; then
            echo "skip/pr-conventions label present — skipping description check"
            exit 0
          fi

          word_count=$(echo "$PR_BODY" | wc -w)
          if [ "$word_count" -lt 2 ]; then
            marker="<!-- conventions:pr-description-check -->"
            already=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --jq "[.[] | select(.body | contains(\"${marker}\"))] | length")
            if [ "$already" -eq 0 ]; then
              gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
                --body "${marker}
          Please add a description to this PR explaining what it does and why. See our [coding conventions](docs/conventions.md)."
            fi
            echo "::error::PR has no description"
            exit 1
          fi

  # ----------------------------------------------------------------------------
  # Commit Message Check
  # ----------------------------------------------------------------------------

  commit-message-check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Check conventional commit format
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels -q '.labels[].name')
          if echo "$labels" | grep -q '^skip/pr-conventions$'; then
            echo "skip/pr-conventions label present — skipping commit message check"
            exit 0
          fi

          # shellcheck disable=SC2016  # $subject is a jq variable, not shell
          bad=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/commits" \
            --paginate --jq '[.[] | select(.parents | length == 1) |
              (.commit.message | split("\n")[0]) as $subject |
              select(($subject | test("^(build|chore|ci|docs|feat|fix|perf|refactor|test)(\\([a-z0-9-]+\\))?!?: .+") | not) or ($subject | length > 72)) |
              "- `\(.sha[:7])`: `\($subject)`"] | join("\n")')

          if [ -n "$bad" ]; then
            marker="<!-- conventions:commit-message-check -->"
            already=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --jq "[.[] | select(.body | contains(\"${marker}\"))] | length")
            if [ "$already" -eq 0 ]; then
              gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
                --body "${marker}
          **Non-conforming commit subjects** (expected \`type(scope): summary\`, ≤72 chars, types: build/chore/ci/docs/feat/fix/perf/refactor/test):

          ${bad}

          Amend with \`git commit --amend\` or rewrite with \`git rebase -i\`."
            fi
            echo "::error::Commit subjects violate conventional commit format"
            exit 1
          fi

  # ----------------------------------------------------------------------------
  # DCO Check (Signed-off-by)
  # ----------------------------------------------------------------------------

  dco-check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Check Signed-off-by trailers
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels -q '.labels[].name')
          if echo "$labels" | grep -q '^skip/pr-conventions$'; then
            echo "skip/pr-conventions label present — skipping DCO check"
            exit 0
          fi

          missing=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/commits" \
            --paginate --jq '[.[] | select(.parents | length == 1) | select(.commit.message | test("(?m)^Signed-off-by: .+ <.+>$") | not) | .sha[:7]] | join(", ")')

          if [ -n "$missing" ]; then
            marker="<!-- conventions:dco-check -->"
            already=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --jq "[.[] | select(.body | contains(\"${marker}\"))] | length")
            if [ "$already" -eq 0 ]; then
              gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
                --body "${marker}
          **Missing \`Signed-off-by\` trailer**: ${missing}. Sign-off asserts you reviewed and understand your changes (see [conventions](docs/conventions.md#code-responsibility)). Amend with \`git commit --amend -s\`."
            fi
            echo "::error::Commits missing Signed-off-by: ${missing}"
            exit 1
          fi

  # ----------------------------------------------------------------------------
  # Signed Commits Check
  # ----------------------------------------------------------------------------

  signed-commits-check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Check signed commits in PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels -q '.labels[].name')
          if echo "$labels" | grep -q '^skip/commit-signing$'; then
            echo "skip/commit-signing label present — skipping signing check"
            exit 0
          fi

          unsigned=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/commits" \
            --paginate --jq '[.[] | select(.parents | length == 1) | select(.commit.verification.verified == false) | .sha[:7]] | join(", ")')

          if [ -n "$unsigned" ]; then
            marker="<!-- conventions:signed-commits-check -->"
            already=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --jq "[.[] | select(.body | contains(\"${marker}\"))] | length")
            if [ "$already" -eq 0 ]; then
              gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
                --body "${marker}
          **Unsigned commits**: ${unsigned}. Please [sign your commits](https://docs.github.com/en/authentication/managing-commit-signature-verification)."
            fi
            echo "::error::Unsigned commits found: ${unsigned}"
            exit 1
          fi

  # ----------------------------------------------------------------------------
  # Authorship Check
  # ----------------------------------------------------------------------------

  authorship-check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Check for AI tool authorship
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels -q '.labels[].name')
          if echo "$labels" | grep -q '^skip/pr-conventions$'; then
            echo "skip/pr-conventions label present — skipping authorship check"
            exit 0
          fi

          commits=$(gh api \
            "repos/${{ github.repository }}/pulls/${PR_NUMBER}/commits" \
            --paginate)

          AI_EMAIL='noreply@anthropic\.com'
          AI_AUTHOR='claude (code|fable|opus|sonnet|haiku)|\bcopilot\b|\bcodeium\b|\btabnine\b|\bwindsurf\b|\bamazon q\b|\bgemini code\b|\baider\b|\banthropic\b'
          AI_TOOL='claude|anthropic|copilot|codeium|tabnine|windsurf|cursor|amazon\.q|gemini|aider|noreply@anthropic\.com'
          CREDIT='^\s*(co-authored-by|assisted-by|generated-by|authored-by)\s*:'
          ANY_TRAILER='^\s*(co-authored-by|assisted-by|generated-by|authored-by|signed-off-by)\s*:'

          violations=$(echo "$commits" | jq -r \
            --arg ai_email "$AI_EMAIL" \
            --arg ai_author "$AI_AUTHOR" \
            --arg ai_tool "$AI_TOOL" \
            --arg credit "$CREDIT" \
            --arg any_trailer "$ANY_TRAILER" '
            [
              (.[] | select(.parents | length == 1) |
                .sha[:7] as $sha |
                select(
                  (.commit.author.email |
                    test($ai_email; "i")) or
                  (.commit.committer.email |
                    test($ai_email; "i"))
                ) |
                "- `\($sha)`: AI tool email in author/committer"),
              (.[] | select(.parents | length == 1) |
                .sha[:7] as $sha |
                select(
                  (.commit.author.name |
                    test($ai_author; "i")) or
                  (.commit.committer.name |
                    test($ai_author; "i"))
                ) |
                "- `\($sha)`: AI tool in author/committer name"),
              (.[] | select(.parents | length == 1) |
                .sha[:7] as $sha |
                .commit.message | split("\n")[] |
                select(
                  (test($any_trailer; "i") and
                    test($ai_email; "i")) or
                  (test($credit; "i") and
                    test($ai_tool; "i"))
                ) |
                "- `\($sha)`: `\(gsub("^\\s+"; ""))`")
            ] | join("\n")
          ')

          if [ -n "$violations" ]; then
            marker="<!-- conventions:ai-authorship-check -->"
            already=$(gh api \
              "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --jq "[.[] | select(.body | contains(\"${marker}\"))] | length")
            if [ "$already" -eq 0 ]; then
              gh pr comment "$PR_NUMBER" \
                --repo "${{ github.repository }}" \
                --body "${marker}
          **Tool authorship detected**:

          ${violations}

          This project doesn't allow commits which are authored or signed-off by tools.
          Commits need to be authored by and signed-off by the human(s) responsible for the PR, with their name and contact.
          Please see our development documentation for more details."
            fi
            echo "::error::Tool authorship found in PR commits"
            exit 1
          fi
