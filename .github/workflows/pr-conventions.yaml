name: PR Conventions

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------
#
# Enforces the reviewability rules documented in docs/conventions.md. All
# checks operate through the GitHub API only; PR code is never checked out.
#
# This runs on pull_request, not pull_request_target, so fork and Dependabot
# PRs get a read-only GITHUB_TOKEN and no Actions secrets. The praxis-bot app
# token is only needed for the maintainer bypass, so that lookup is skipped
# whenever the app credentials aren't available and the checks run as normal.
# PR comments are best-effort for the same reason: when one can't be posted,
# the failing check still says what to fix in its error and job summary.
#
# Other repositories run this same file through workflow_call, from a caller
# triggered by pull_request or pull_request_target. The caller job needs
# `contents: read` and `pull-requests: write`, and should pass the praxis-bot
# secrets explicitly. When this runs here on pull_request the inputs context
# is empty, so each input's default is repeated where the input is read.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      max-additions:
        description: Most non-test lines a PR may add before the size check fails
        type: number
        default: 750
      bypass-teams:
        description: >-
          Comma-separated org team slugs whose members skip the size and
          description checks. Every slug must be a real team in the org.
        type: string
        default: project-leadership,core-maintainers
      conventions-doc:
        description: Repository path of the conventions document PR comments link to
        type: string
        default: docs/conventions.md
      commit-subject-pattern:
        description: Regex (jq syntax) every commit subject must match
        type: string
        default: '^(build|chore|ci|docs|feat|fix|perf|refactor|test)(\([a-z0-9-]+\))?!?: .+'
      commit-subject-max-length:
        description: Longest allowed commit subject, in characters (0 turns the limit off)
        type: number
        default: 72
      dco-check:
        description: >-
          Require a Signed-off-by trailer on every commit. Turn this off when
          the DCO GitHub App already enforces it.
        type: boolean
        default: true
      dep-version-check:
        description: >-
          Require MAJOR.MINOR.PATCH versions in the root Cargo.toml's
          [workspace.dependencies]. Skipped when there is no root Cargo.toml.
        type: boolean
        default: true
    secrets:
      PRAXIS_BOT_APP_ID:
        description: praxis-bot app ID, for the maintainer bypass lookup
        required: false
      PRAXIS_BOT_APP_PRIVATE_KEY:
        description: praxis-bot app private key, for the maintainer bypass lookup
        required: false

concurrency:
  # The suffix keeps this group distinct from a caller's own
  # `${{ github.workflow }}-<number>` group, which would otherwise deadlock.
  group: ${{ github.workflow }}-pr-conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # ----------------------------------------------------------------------------
  # PR Size Check
  # ----------------------------------------------------------------------------

  pr-size-check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write
    env:
      # Actions secrets are withheld from fork and Dependabot PRs.
      BOT_APP_AVAILABLE: ${{ secrets.PRAXIS_BOT_APP_ID != '' }}
    steps:
      - name: Generate token
        id: app-token
        if: env.BOT_APP_AVAILABLE == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PRAXIS_BOT_APP_ID }}
          private-key: ${{ secrets.PRAXIS_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check maintainer bypass
        id: maintainer-bypass
        if: env.BOT_APP_AVAILABLE == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BYPASS_TEAMS: ${{ inputs.bypass-teams || 'project-leadership,core-maintainers' }}
        run: |
          set -euo pipefail
          bypass=false
          IFS=',' read -ra teams <<< "$BYPASS_TEAMS"
          for team in "${teams[@]}"; do
            slug="$(echo "$team" | xargs)"
            [ -z "$slug" ] && continue
            state="$(gh api "/orgs/${ORG}/teams/${slug}/memberships/${PR_AUTHOR}" \
              --jq '.state' 2>/dev/null || true)"
            if [ "$state" = "active" ]; then
              echo "::notice::${PR_AUTHOR} is on '${slug}'; bypassing size and description checks"
              bypass=true
              break
            fi
          done
          echo "bypass=${bypass}" >> "$GITHUB_OUTPUT"

      - name: Check PR size
        if: steps.maintainer-bypass.outputs.bypass != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAX_ADDITIONS: ${{ inputs.max-additions || 750 }}
        run: |
          labels=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels -q '.labels[].name')
          if echo "$labels" | grep -q '^skip/pr-conventions$'; then
            echo "skip/pr-conventions label present, skipping size check"
            exit 0
          fi

          added=$(python3 - <<'PY'
          import base64, json, os, re, subprocess, urllib.parse, sys

          repo = os.environ.get("REPO", "")
          pr = os.environ.get("PR_NUMBER", "")
          head = os.environ.get("HEAD_SHA", "")

          # Paths whose additions never count toward reviewable PR size: generated/lock
          # files, docs, examples, benchmarks, and every test artifact (top-level tests/,
          # per-crate crates/*/tests/, criterion benches/, and test-named .rs files).
          EXCLUDE = re.compile(
              r"Cargo\.(lock|toml)$"
              r"|\.md$"
              r"|^(examples|docs|benchmarks)/"
              r"|(^|/)tests?/"
              r"|(^|/)benches/"
              r"|(^|/)(tests?|[^/]*_tests?)\.rs$"
          )

          # A line that is solely a #[cfg(...)] (or #![cfg(...)]) attribute; group(1) is
          # the predicate. cfg_attr(...) is intentionally not matched (it applies an
          # attribute conditionally, it does not gate the item out of non-test builds).
          CFG_ATTR = re.compile(r'^\s*#!?\[\s*cfg\s*\((.*)\)\s*\]\s*$')


          def _extract_paren(s):
              # Contents of the outermost parens in a string beginning with '('.
              depth = 0
              for i, ch in enumerate(s):
                  if ch == "(":
                      depth += 1
                  elif ch == ")":
                      depth -= 1
                      if depth == 0:
                          return s[1:i]
              return s[1:]


          def _split_top(s):
              # Split on top-level commas only.
              parts, depth, cur = [], 0, []
              for ch in s:
                  if ch == "(":
                      depth += 1
                  elif ch == ")":
                      depth -= 1
                  if ch == "," and depth == 0:
                      parts.append("".join(cur))
                      cur = []
                  else:
                      cur.append(ch)
              if cur:
                  parts.append("".join(cur))
              return [p.strip() for p in parts if p.strip()]


          def _eval_cfg(s):
              # Truth of a cfg predicate with test disabled and every other predicate
              # assumed reachable (True). Strings are already blanked by clean(), so a
              # feature = "test" flag never looks like the bare `test` predicate.
              s = s.strip()
              for op in ("all", "any", "not"):
                  if s.startswith(op):
                      rest = s[len(op):].lstrip()
                      if rest.startswith("("):
                          vals = [_eval_cfg(a) for a in _split_top(_extract_paren(rest))]
                          if op == "all":
                              return all(vals)
                          if op == "any":
                              return any(vals)
                          return not (vals[0] if vals else True)
              return s != "test"


          def is_test_only(pred):
              # True when the gated item cannot be compiled with test disabled, i.e. it is
              # test-only code (cfg(test), cfg(all(test, ...)), ...) rather than dual-use
              # (cfg(any(test, feature = ...))) or non-test (cfg(not(test))).
              return _eval_cfg(pred) is False


          def sh(*args):
              return subprocess.run(args, capture_output=True, text=True)


          def gh_files():
              r = sh("gh", "api", f"repos/{repo}/pulls/{pr}/files", "--paginate", "--jq", ".[]")
              if r.returncode != 0:
                  sys.stderr.write(r.stderr)
                  raise SystemExit(1)
              return [json.loads(x) for x in r.stdout.splitlines() if x.strip()]


          def file_content(path):
              q = urllib.parse.quote(path)
              r = sh("gh", "api", f"repos/{repo}/contents/{q}?ref={head}", "--jq", ".content")
              if r.returncode != 0 or not r.stdout.strip():
                  return None
              try:
                  return base64.b64decode(r.stdout).decode("utf-8", "replace")
              except Exception:
                  return None


          def added_lines(patch):
              # New-file line numbers added by this patch, or None if GitHub omitted it.
              if not patch:
                  return None
              added, new = set(), 0
              for line in patch.split("\n"):
                  if line.startswith("@@"):
                      m = re.search(r"\+(\d+)", line)
                      new = int(m.group(1)) if m else new
                  elif line.startswith("\\"):
                      continue
                  elif line.startswith("+") and not line.startswith("+++"):
                      added.add(new)
                      new += 1
                  elif line.startswith("-") and not line.startswith("---"):
                      pass
                  else:
                      new += 1
              return added


          def clean(src):
              # Blank the contents of comments and string/char literals (preserving
              # newlines and length) so braces inside them can't distort test detection.
              out, i, n = [], 0, len(src)
              push = lambda ch: out.append("\n" if ch == "\n" else " ")
              while i < n:
                  c, two = src[i], src[i:i + 2]
                  if two == "//":
                      while i < n and src[i] != "\n":
                          push(src[i])
                          i += 1
                  elif two == "/*":
                      depth = 0
                      while i < n:
                          t = src[i:i + 2]
                          if t == "/*":
                              depth += 1
                              push(" ")
                              push(" ")
                              i += 2
                          elif t == "*/":
                              depth -= 1
                              push(" ")
                              push(" ")
                              i += 2
                              if depth == 0:
                                  break
                          else:
                              push(src[i])
                              i += 1
                  else:
                      m = re.match(r'b?r(#*)"', src[i:])
                      if m:
                          close = '"' + m.group(1)
                          j = i + m.end()
                          for k in range(i, j):
                              push(src[k])
                          end = src.find(close, j)
                          end = n if end == -1 else end
                          for k in range(j, min(end, n)):
                              push(src[k])
                          for k in range(end, min(end + len(close), n)):
                              push(src[k])
                          i = min(end + len(close), n)
                      elif c == '"':
                          push(c)
                          i += 1
                          while i < n and src[i] != '"':
                              if src[i] == "\\":
                                  push(src[i])
                                  i += 1
                              if i < n:
                                  push(src[i])
                                  i += 1
                          if i < n:
                              push(src[i])
                              i += 1
                      elif c == "'" and (src[i + 1:i + 2] == "\\" or src[i + 2:i + 3] == "'"):
                          push(c)
                          i += 1
                          while i < n and src[i] != "'":
                              if src[i] == "\\":
                                  push(src[i])
                                  i += 1
                              if i < n:
                                  push(src[i])
                                  i += 1
                          if i < n:
                              push(src[i])
                              i += 1
                      else:
                          out.append(c)
                          i += 1
              return "".join(out)


          def item_end(lines, j):
              # Last line index of the item beginning at or after line j: a brace-matched
              # block, or a blockless item terminated by ';'.
              depth, started, n = 0, False, len(lines)
              for k in range(j, n):
                  for ch in lines[k]:
                      if ch == "{":
                          depth += 1
                          started = True
                      elif ch == "}":
                          depth -= 1
                          if started and depth == 0:
                              return k
                      elif ch == ";" and not started:
                          return k
              return n - 1


          def test_line_set(cleaned):
              lines = cleaned.split("\n")
              n = len(lines)
              marked = set()
              i = 0
              while i < n:
                  cfg = CFG_ATTR.match(lines[i])
                  if cfg and is_test_only(cfg.group(1)):
                      start = i
                      j = i + 1
                      while j < n and (not lines[j].strip()
                                       or lines[j].lstrip().startswith("#[")
                                       or lines[j].lstrip().startswith("#![")):
                          j += 1
                      end = n - 1 if j >= n else item_end(lines, j)
                      for k in range(start, end + 1):
                          marked.add(k + 1)
                      i = end + 1
                  else:
                      i += 1
              return marked


          def count():
              total = 0
              for f in gh_files():
                  path = f["filename"]
                  if f.get("status") == "removed" or EXCLUDE.search(path):
                      continue
                  if not path.endswith(".rs"):
                      total += f.get("additions", 0)
                      continue
                  added = added_lines(f.get("patch"))
                  if added is None:
                      total += f.get("additions", 0)
                      continue
                  content = file_content(path)
                  if content is None:
                      total += len(added)
                      continue
                  tests = test_line_set(clean(content))
                  total += sum(1 for ln in added if ln not in tests)
              return total

          print(count())
          PY
          )

          if [ "$added" -gt "$MAX_ADDITIONS" ]; then
            marker="<!-- conventions:pr-size-check -->"
            already=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --jq "[.[] | select(.body | contains(\"${marker}\"))] | length")
            if [ "$already" -eq 0 ]; then
              gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
                --body "${marker}
          **PR too large**: ${added} non-test lines added (limit: ${MAX_ADDITIONS}, excludes Cargo files, docs, examples, benchmarks, and all tests including inline #[cfg(test)] code). Please split into smaller PRs. Add \`skip/pr-conventions\` label to override." \
                || echo "::warning::could not comment on the PR (fork and Dependabot PRs get a read-only token)"
            fi
            echo "::error::PR has ${added} non-test lines added (limit: ${MAX_ADDITIONS})"
            exit 1
          fi

  # ----------------------------------------------------------------------------
  # PR Description Check
  # ----------------------------------------------------------------------------

  pr-description-check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write
    env:
      # Actions secrets are withheld from fork and Dependabot PRs.
      BOT_APP_AVAILABLE: ${{ secrets.PRAXIS_BOT_APP_ID != '' }}
    steps:
      - name: Generate token
        id: app-token
        if: env.BOT_APP_AVAILABLE == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PRAXIS_BOT_APP_ID }}
          private-key: ${{ secrets.PRAXIS_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check maintainer bypass
        id: maintainer-bypass
        if: env.BOT_APP_AVAILABLE == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BYPASS_TEAMS: ${{ inputs.bypass-teams || 'project-leadership,core-maintainers' }}
        run: |
          set -euo pipefail
          bypass=false
          IFS=',' read -ra teams <<< "$BYPASS_TEAMS"
          for team in "${teams[@]}"; do
            slug="$(echo "$team" | xargs)"
            [ -z "$slug" ] && continue
            state="$(gh api "/orgs/${ORG}/teams/${slug}/memberships/${PR_AUTHOR}" \
              --jq '.state' 2>/dev/null || true)"
            if [ "$state" = "active" ]; then
              echo "::notice::${PR_AUTHOR} is on '${slug}'; bypassing size and description checks"
              bypass=true
              break
            fi
          done
          echo "bypass=${bypass}" >> "$GITHUB_OUTPUT"

      - name: Check for description
        if: steps.maintainer-bypass.outputs.bypass != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          CONVENTIONS_DOC: ${{ inputs.conventions-doc || 'docs/conventions.md' }}
        run: |
          labels=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels -q '.labels[].name')
          if echo "$labels" | grep -q '^skip/pr-conventions$'; then
            echo "skip/pr-conventions label present, skipping description check"
            exit 0
          fi

          word_count=$(echo "$PR_BODY" | wc -w)
          if [ "$word_count" -lt 2 ]; then
            marker="<!-- conventions:pr-description-check -->"
            already=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --jq "[.[] | select(.body | contains(\"${marker}\"))] | length")
            if [ "$already" -eq 0 ]; then
              gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
                --body "${marker}
          Please add a description to this PR explaining what it does and why. See our [coding conventions](${CONVENTIONS_DOC})." \
                || echo "::warning::could not comment on the PR (fork and Dependabot PRs get a read-only token)"
            fi
            echo "::error::PR has no description"
            exit 1
          fi

  # ----------------------------------------------------------------------------
  # Dependency Version Check
  # ----------------------------------------------------------------------------
  #
  # Every [workspace.dependencies] version must be MAJOR.MINOR.PATCH, so
  # semver-checks and audits see the exact version the workspace was built
  # against. A `semver:ignore` comment on the line, or on the line above,
  # exempts one dependency.

  dep-version-check:
    if: ${{ !github.event.pull_request.draft && toJSON(inputs.dep-version-check) != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check workspace dependency versions
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! content=$(gh api "repos/${{ github.repository }}/contents/Cargo.toml?ref=${HEAD_SHA}" \
              --jq '.content' 2>&1); then
            if [[ "$content" == *"HTTP 404"* ]]; then
              echo "No root Cargo.toml, nothing to check"
              exit 0
            fi
            echo "::error::could not fetch Cargo.toml: ${content}"
            exit 1
          fi
          echo "$content" | base64 -d > "$RUNNER_TEMP/cargo.toml"

          in_ws=false
          bad=0
          skip_next=false
          while IFS= read -r line; do
            if [[ "$line" == "[workspace.dependencies]" ]]; then
              in_ws=true
              skip_next=false
              continue
            elif [[ "$line" == "["* ]]; then
              in_ws=false
              skip_next=false
              continue
            fi

            $in_ws || continue
            [[ -z "$line" ]] && continue

            if [[ "$line" == "#"* ]]; then
              [[ "$line" == *"semver:ignore"* ]] && skip_next=true
              continue
            fi

            if $skip_next || [[ "$line" == *"semver:ignore"* ]]; then
              skip_next=false
              continue
            fi
            skip_next=false

            ver=""
            if [[ "$line" =~ ^[a-zA-Z][a-zA-Z0-9_-]*[[:space:]]*=[[:space:]]*\"([^\"]+)\" ]]; then
              ver="${BASH_REMATCH[1]}"
            elif [[ "$line" =~ version[[:space:]]*=[[:space:]]*\"([^\"]+)\" ]]; then
              ver="${BASH_REMATCH[1]}"
            fi

            if [[ -n "$ver" ]]; then
              dots="${ver//[^.]/}"
              if [[ ${#dots} -ne 2 ]]; then
                crate="${line%%[[:space:]]*=*}"
                echo "::error::${crate} = \"${ver}\" is not three-component semver (expected MAJOR.MINOR.PATCH)"
                bad=1
              fi
            fi
          done < "$RUNNER_TEMP/cargo.toml"

          if [[ "$bad" -eq 1 ]]; then
            exit 1
          fi

  # ----------------------------------------------------------------------------
  # Commit Message Check
  # ----------------------------------------------------------------------------

  commit-message-check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Check conventional commit format
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUBJECT_PATTERN: >-
            ${{ inputs.commit-subject-pattern || '^(build|chore|ci|docs|feat|fix|perf|refactor|test)(\([a-z0-9-]+\))?!?: .+' }}
          MAX_LENGTH_INPUT: ${{ inputs.commit-subject-max-length }}
        run: |
          # An explicit 0 turns the length limit off, so default in shell
          # rather than with || in the expression above.
          max_length="${MAX_LENGTH_INPUT:-72}"

          labels=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels -q '.labels[].name')
          if echo "$labels" | grep -q '^skip/pr-conventions$'; then
            echo "skip/pr-conventions label present, skipping commit message check"
            exit 0
          fi

          # shellcheck disable=SC2016  # $subject, $re and $max are jq variables, not shell
          bad=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/commits" --paginate \
            | jq -rs --arg re "$SUBJECT_PATTERN" --argjson max "$max_length" \
              'add | [.[] | select(.parents | length == 1) |
                (.commit.message | split("\n")[0]) as $subject |
                select(($subject | test($re) | not) or ($max > 0 and ($subject | length) > $max)) |
                "- `\(.sha[:7])`: `\($subject)`"] | join("\n")')

          if [ -n "$bad" ]; then
            limit=""
            if [ "$max_length" -gt 0 ]; then
              limit=", at most ${max_length} chars"
            fi
            marker="<!-- conventions:commit-message-check -->"
            already=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --jq "[.[] | select(.body | contains(\"${marker}\"))] | length")
            if [ "$already" -eq 0 ]; then
              gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
                --body "${marker}
          **Non-conforming commit subjects** (expected \`type(scope): summary\`${limit}, matching \`${SUBJECT_PATTERN}\`):

          ${bad}

          Amend with \`git commit --amend\` or rewrite with \`git rebase -i\`." \
                || echo "::warning::could not comment on the PR (fork and Dependabot PRs get a read-only token)"
            fi
            printf 'Non-conforming commit subjects:\n\n%s\n' "$bad" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Commit subjects violate conventional commit format"
            exit 1
          fi

  # ----------------------------------------------------------------------------
  # DCO Check (Signed-off-by)
  # ----------------------------------------------------------------------------

  dco-check:
    if: ${{ !github.event.pull_request.draft && toJSON(inputs.dco-check) != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Check Signed-off-by trailers
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CONVENTIONS_DOC: ${{ inputs.conventions-doc || 'docs/conventions.md' }}
        run: |
          labels=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels -q '.labels[].name')
          if echo "$labels" | grep -q '^skip/pr-conventions$'; then
            echo "skip/pr-conventions label present, skipping DCO check"
            exit 0
          fi

          missing=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/commits" \
            --paginate --jq '[.[] | select(.parents | length == 1) | select(.commit.message | test("(?m)^Signed-off-by: .+ <.+>$") | not) | .sha[:7]] | join(", ")')

          if [ -n "$missing" ]; then
            marker="<!-- conventions:dco-check -->"
            already=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --jq "[.[] | select(.body | contains(\"${marker}\"))] | length")
            if [ "$already" -eq 0 ]; then
              gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
                --body "${marker}
          **Missing \`Signed-off-by\` trailer**: ${missing}. Sign-off asserts you reviewed and understand your changes (see [conventions](${CONVENTIONS_DOC}#code-responsibility)). Amend with \`git commit --amend -s\`." \
                || echo "::warning::could not comment on the PR (fork and Dependabot PRs get a read-only token)"
            fi
            echo "::error::Commits missing Signed-off-by: ${missing}"
            exit 1
          fi

  # ----------------------------------------------------------------------------
  # Signed Commits Check
  # ----------------------------------------------------------------------------

  signed-commits-check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Check signed commits in PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels -q '.labels[].name')
          if echo "$labels" | grep -q '^skip/commit-signing$'; then
            echo "skip/commit-signing label present, skipping signing check"
            exit 0
          fi

          unsigned=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/commits" \
            --paginate --jq '[.[] | select(.parents | length == 1) | select(.commit.verification.verified == false) | .sha[:7]] | join(", ")')

          if [ -n "$unsigned" ]; then
            marker="<!-- conventions:signed-commits-check -->"
            already=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --jq "[.[] | select(.body | contains(\"${marker}\"))] | length")
            if [ "$already" -eq 0 ]; then
              gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
                --body "${marker}
          **Unsigned commits**: ${unsigned}. Please [sign your commits](https://docs.github.com/en/authentication/managing-commit-signature-verification)." \
                || echo "::warning::could not comment on the PR (fork and Dependabot PRs get a read-only token)"
            fi
            echo "::error::Unsigned commits found: ${unsigned}"
            exit 1
          fi

  # ----------------------------------------------------------------------------
  # Authorship Check
  # ----------------------------------------------------------------------------

  authorship-check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Check for AI tool authorship
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels -q '.labels[].name')
          if echo "$labels" | grep -q '^skip/pr-conventions$'; then
            echo "skip/pr-conventions label present, skipping authorship check"
            exit 0
          fi

          commits=$(gh api \
            "repos/${{ github.repository }}/pulls/${PR_NUMBER}/commits" \
            --paginate)

          AI_EMAIL='noreply@anthropic\.com'
          AI_AUTHOR='claude (code|fable|opus|sonnet|haiku)|\bcopilot\b|\bcodeium\b|\btabnine\b|\bwindsurf\b|\bamazon q\b|\bgemini code\b|\baider\b|\banthropic\b'
          AI_TOOL='claude|anthropic|copilot|codeium|tabnine|windsurf|cursor|amazon\.q|gemini|aider|noreply@anthropic\.com'
          CREDIT='^\s*(co-authored-by|assisted-by|generated-by|authored-by)\s*:'
          ANY_TRAILER='^\s*(co-authored-by|assisted-by|generated-by|authored-by|signed-off-by)\s*:'

          violations=$(echo "$commits" | jq -r \
            --arg ai_email "$AI_EMAIL" \
            --arg ai_author "$AI_AUTHOR" \
            --arg ai_tool "$AI_TOOL" \
            --arg credit "$CREDIT" \
            --arg any_trailer "$ANY_TRAILER" '
            [
              (.[] | select(.parents | length == 1) |
                .sha[:7] as $sha |
                select(
                  (.commit.author.email |
                    test($ai_email; "i")) or
                  (.commit.committer.email |
                    test($ai_email; "i"))
                ) |
                "- `\($sha)`: AI tool email in author/committer"),
              (.[] | select(.parents | length == 1) |
                .sha[:7] as $sha |
                select(
                  (.commit.author.name |
                    test($ai_author; "i")) or
                  (.commit.committer.name |
                    test($ai_author; "i"))
                ) |
                "- `\($sha)`: AI tool in author/committer name"),
              (.[] | select(.parents | length == 1) |
                .sha[:7] as $sha |
                .commit.message | split("\n")[] |
                select(
                  (test($any_trailer; "i") and
                    test($ai_email; "i")) or
                  (test($credit; "i") and
                    test($ai_tool; "i"))
                ) |
                "- `\($sha)`: `\(gsub("^\\s+"; ""))`")
            ] | join("\n")
          ')

          if [ -n "$violations" ]; then
            marker="<!-- conventions:ai-authorship-check -->"
            already=$(gh api \
              "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --jq "[.[] | select(.body | contains(\"${marker}\"))] | length")
            if [ "$already" -eq 0 ]; then
              gh pr comment "$PR_NUMBER" \
                --repo "${{ github.repository }}" \
                --body "${marker}
          **Tool authorship detected**:

          ${violations}

          This project doesn't allow commits which are authored or signed-off by tools.
          Commits need to be authored by and signed-off by the human(s) responsible for the PR, with their name and contact.
          Please see our development documentation for more details." \
                || echo "::warning::could not comment on the PR (fork and Dependabot PRs get a read-only token)"
            fi
            printf 'Tool authorship detected:\n\n%s\n' "$violations" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Tool authorship found in PR commits"
            exit 1
          fi
