name: Publish Dry Run

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------
#
# Other repositories run this same file through workflow_call. The caller job
# must grant at least the permissions the jobs below ask for. Actions are
# pinned by SHA rather than referenced by local path, because a called
# workflow resolves local paths against the caller's checkout.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      make-args:
        description: Extra arguments for `make publish-dry-run` (e.g. PUBLISH_DRY_RUN_FLAGS=--no-verify)
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-publish-dry-run-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ----------------------------------------------------------------------------
  # Verify crates can be packaged and published
  # ----------------------------------------------------------------------------

  publish-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect workspace members
        id: ws
        run: |
          if grep -qE '^members = \[\]$' Cargo.toml; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Rust
        if: steps.ws.outputs.empty == 'false'
        uses: praxis-proxy/conventions/.github/actions/setup-rust@747ec184a0e565c1948bb77ea58487839b78db55 # v0.2.0-9-g747ec18
        with:
          cache-suffix: publish

      - name: Publish dry run
        if: steps.ws.outputs.empty == 'false'
        env:
          MAKE_ARGS: ${{ inputs.make-args }}
        run: |
          # MAKE_ARGS is split on purpose, so several VAR=value pairs can pass.
          # shellcheck disable=SC2086
          make publish-dry-run $MAKE_ARGS
