name: SemVer

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------
#
# cargo-semver-checks only analyzes publishable crates; with only
# publish = false members (like the probe crate) the job is skipped.
#
# Other repositories run this same file through workflow_call. The caller job
# must grant at least the permissions the jobs below ask for. Actions are
# pinned by SHA rather than referenced by local path, because a called
# workflow resolves local paths against the caller's checkout.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-semver-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ----------------------------------------------------------------------------
  # SemVer Compliance
  # ----------------------------------------------------------------------------

  semver:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect publishable workspace members
        id: ws
        run: |
          if grep -qE '^members = \[\]$' Cargo.toml; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif ! grep -rL 'publish = false' --include=Cargo.toml crates/ 2>/dev/null | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Rust
        if: steps.ws.outputs.skip == 'false'
        uses: praxis-proxy/conventions/.github/actions/setup-rust@747ec184a0e565c1948bb77ea58487839b78db55 # v0.2.0-9-g747ec18
        with:
          cache-suffix: semver

      - name: Cache cargo-semver-checks
        if: steps.ws.outputs.skip == 'false'
        id: cache-semver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-semver-checks
          key: cargo-semver-checks-${{ runner.os }}

      - name: Install cargo-semver-checks
        if: steps.ws.outputs.skip == 'false' && steps.cache-semver.outputs.cache-hit != 'true'
        # The shared rust-cache also restores ~/.cargo/bin, so the binary may
        # already be present even when this step's own cache key misses. Install
        # only when it is absent; otherwise cargo install aborts "binary exists".
        run: command -v cargo-semver-checks > /dev/null || cargo install cargo-semver-checks --locked

      - name: Check SemVer compliance
        if: steps.ws.outputs.skip == 'false'
        run: make semver
