name: MSRV

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------
#
# Other repositories run this same file through workflow_call. The caller job
# must grant at least the permissions the jobs below ask for. Actions are
# pinned by SHA rather than referenced by local path, because a called
# workflow resolves local paths against the caller's checkout.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-msrv-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ----------------------------------------------------------------------------
  # Minimum Supported Rust Version
  # ----------------------------------------------------------------------------

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect workspace members
        id: ws
        run: |
          if grep -qE '^members = \[\]$' Cargo.toml; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the MSRV from Cargo.toml
        id: msrv
        if: steps.ws.outputs.empty == 'false'
        run: |
          version=$(sed -nE 's/^rust-version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::no rust-version in the root Cargo.toml, so there is no MSRV to check"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Rust (MSRV)
        if: steps.ws.outputs.empty == 'false'
        uses: praxis-proxy/conventions/.github/actions/setup-rust@747ec184a0e565c1948bb77ea58487839b78db55 # v0.2.0-9-g747ec18
        with:
          rust-version: ${{ steps.msrv.outputs.version }}
          cache-suffix: msrv

      - name: Check workspace compiles on MSRV
        if: steps.ws.outputs.empty == 'false'
        run: cargo check --workspace
